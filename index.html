<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Factory Inspection Dashboard</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="container">
    <h1>Inspection Dashboard</h1>
    
    <input type="text" id="searchInput" onkeyup="filterFiles()" placeholder="Search reports (e.g., REC 7.2.12)...">

    <ul id="fileList" class="nav-links">
        <li><a href="production/seam-inspection.html">REC 7.2.12 Double Seam Inspection</a></li>
        <li><a href="production/thickness-check.html">REC 7.2.13 Seam Thickness Check</a></li>
        <li><a href="production/other-report.html">REC 7.2.14 Calibration Report</a></li>
    </ul>
</div>
<script>
function filterFiles() {
    let input = document.getElementById('searchInput');
    let filter = input.value.toUpperCase();
    let ul = document.getElementById("fileList");
    let li = ul.getElementsByTagName('li');

    for (let i = 0; i < li.length; i++) {
        let a = li[i].getElementsByTagName("a")[0];
        let txtValue = a.textContent || a.innerText;
        if (txtValue.toUpperCase().indexOf(filter) > -1) {
            li[i].style.display = "";
        } else {
            li[i].style.display = "none";
        }
    }
}
</script></body>
</html>

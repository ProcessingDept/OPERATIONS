<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Double Seam Inspection | REC 7.2.12</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 20px; background: #f8f9fa; padding: 15px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        th { background: #003366; color: white; }
        .input-cell { width: 50px; text-align: center; }
        .btn-submit { background: #28a745; color: white; padding: 15px; border: none; cursor: pointer; width: 100%; font-size: 16px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Double Seam Inspection - REC 7.2.12</h2>
    
    <div class="meta-grid">
        <div><label>AG CODE</label><input type="text" id="ag_code"></div>
        <div><label>Pallet Cans</label><input type="text" id="pallet_cans"></div>
    </div>

    <table>
        <thead>
            <tr><th>Metric</th><th colspan="3">CAN 1</th><th colspan="3">CAN 2</th></tr>
        </thead>
        <tbody id="tableBody">
            <tr class="metric-row" data-metric="seam_thickness"><td>Seam Thickness</td>
                <td><input type="number" class="p1"></td><td><input type="number" class="p2"></td><td><input type="number" class="p3"></td>
                <td><input type="number" class="p1"></td><td><input type="number" class="p2"></td><td><input type="number" class="p3"></td></tr>
            <tr class="metric-row" data-metric="seam_length"><td>Seam Length</td>
                <td><input type="number" class="p1"></td><td><input type="number" class="p2"></td><td><input type="number" class="p3"></td>
                <td><input type="number" class="p1"></td><td><input type="number" class="p2"></td><td><input type="number" class="p3"></td></tr>
            <tr class="metric-row" data-metric="body_hook"><td>Body Hook</td>
                <td><input type="number" class="p1"></td><td><input type="number" class="p2"></td><td><input type="number" class="p3"></td>
                <td><input type="number" class="p1"></td><td><input type="number" class="p2"></td><td><input type="number" class="p3"></td></tr>
            <tr class="metric-row" data-metric="cover_hook"><td>Cover Hook</td>
                <td><input type="number" class="p1"></td><td><input type="number" class="p2"></td><td><input type="number" class="p3"></td>
                <td><input type="number" class="p1"></td><td><input type="number" class="p2"></td><td><input type="number" class="p3"></td></tr>
            <tr class="metric-row" data-metric="actual_overlap"><td>Actual Overlap</td>
                <td><input type="number" class="p1"></td><td><input type="number" class="p2"></td><td><input type="number" class="p3"></td>
                <td><input type="number" class="p1"></td><td><input type="number" class="p2"></td><td><input type="number" class="p3"></td></tr>
            <tr class="metric-row" data-metric="overlap_percent"><td>Overlap %</td>
                <td><input type="number" class="p1"></td><td><input type="number" class="p2"></td><td><input type="number" class="p3"></td>
                <td><input type="number" class="p1"></td><td><input type="number" class="p2"></td><td><input type="number" class="p3"></td></tr>
            <tr class="metric-row" data-metric="bhb_percent"><td>BHB %</td>
                <td><input type="number" class="p1"></td><td><input type="number" class="p2"></td><td><input type="number" class="p3"></td>
                <td><input type="number" class="p1"></td><td><input type="number" class="p2"></td><td><input type="number" class="p3"></td></tr>
            <tr class="metric-row" data-metric="freespace_ext"><td>Freespace Ext</td>
                <td><input type="number" class="p1"></td><td><input type="number" class="p2"></td><td><input type="number" class="p3"></td>
                <td><input type="number" class="p1"></td><td><input type="number" class="p2"></td><td><input type="number" class="p3"></td></tr>
            <tr class="metric-row" data-metric="freespace_int"><td>Freespace Int</td>
                <td><input type="number" class="p1"></td><td><input type="number" class="p2"></td><td><input type="number" class="p3"></td>
                <td><input type="number" class="p1"></td><td><input type="number" class="p2"></td><td><input type="number" class="p3"></td></tr>
        </tbody>
    </table>

    <button class="btn-submit" id="submitBtn" onclick="submitData()">SYNC FULL REPORT TO CLOUD</button>
</div>

<script type="module">
    import { supabase } from '../assets/js/db-config.js';

    window.submitData = async () => {
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "Syncing...";

        try {
            // 1. Insert Header
            const { data: header, error: hErr } = await supabase
                .from('double_seam_inspection_log')
                .insert([{ 
                    inspector: 'Auto-User', 
                    inspection_date: new Date().toISOString(),
                    job_number: 'N/A', 
                    ag_code: document.getElementById('ag_code').value,
                    pallet_code_cans: document.getElementById('pallet_cans').value 
                }])
                .select();
            if (hErr) throw hErr;

            const logId = header[0].id;

            // 2. Automated Measurement Batch
            const rows = document.querySelectorAll('.metric-row');
            const measurements = Array.from(rows).map(row => ({
                log_id: logId,
                metric_name: row.getAttribute('data-metric'),
                can_a_p1: row.querySelectorAll('.p1')[0].value,
                can_a_p2: row.querySelectorAll('.p2')[0].value,
                can_a_p3: row.querySelectorAll('.p3')[0].value,
                can_b_p1: row.querySelectorAll('.p1')[1].value,
                can_b_p2: row.querySelectorAll('.p2')[1].value,
                can_b_p3: row.querySelectorAll('.p3')[1].value
            }));

            const { error: mErr } = await supabase.from('inspection_measurements').insert(measurements);
            if (mErr) throw mErr;

            alert("Sync Successful!");
        } catch (e) {
            alert("Error: " + e.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "SYNC FULL REPORT TO CLOUD";
        }
    };
</script>
</body>
</html>

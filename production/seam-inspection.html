<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QC Inspection | Mobile Pro</title>
    <style>
        body { font-family: sans-serif; padding: 10px; background: #f4f4f9; }
        .controls { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .metric-row { background: #fff; padding: 10px; margin-bottom: 10px; border-radius: 8px; border-left: 5px solid #003366; }
        .row-hidden { display: none; }
        input { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #003366; color: white; border: none; border-radius: 5px; font-size: 18px; }
    </style>
</head>
<body>

<div class="controls">
    <h3>Double Seam Inspection</h3>
    <select id="modeToggle" onchange="toggleMode()">
        <option value="full">Full Audit</option>
        <option value="quick">Quick Test</option>
    </select>
    <input type="text" id="ag_code" placeholder="AG CODE">
</div>

<div id="tableBody">
    <tr class="metric-row" data-metric="seam_thickness">
        <td><strong>Seam Thickness</strong></td>
        <td><input type="number" class="p1" placeholder="C1-P1"></td>
        <td><input type="number" class="p2" placeholder="C1-P2"></td>
    </tr>
    </div>

<button id="submitBtn" onclick="submitData()">SYNC & RUN AI DIAGNOSTIC</button>

<script type="module">
    import { supabase } from '../assets/js/db-config.js';

    window.toggleMode = () => {
        const mode = document.getElementById('modeToggle').value;
        const rows = document.querySelectorAll('.metric-row');
        // If Quick Test, hide all rows except the first 2 (or your essential ones)
        rows.forEach((row, index) => {
            if (mode === 'quick' && index > 1) row.classList.add('row-hidden');
            else row.classList.remove('row-hidden');
        });
    };

    window.submitData = async () => {
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "Syncing...";

        try {
            // 1. Insert Header
            const { data: header } = await supabase.from('double_seam_inspection_log').insert([{ 
                ag_code: document.getElementById('ag_code').value 
            }]).select();

            const logId = header[0].id;
            
            // 2. Insert Measurements (Only visible rows)
            const visibleRows = document.querySelectorAll('.metric-row:not(.row-hidden)');
            const measurements = Array.from(visibleRows).map(row => ({
                log_id: logId,
                metric_name: row.getAttribute('data-metric'),
                can_a_p1: row.querySelector('.p1').value
            }));

            await supabase.from('inspection_measurements').insert(measurements);

            // 3. AI Diagnostic Feedback (Fetch alerts generated by DB trigger)
            const { data: alerts } = await supabase
                .from('inspection_alerts')
                .select('metric, cause, action')
                .eq('log_id', logId);

            if (alerts && alerts.length > 0) {
                let msg = "⚠️ AI DIAGNOSTIC ALERT:\n";
                alerts.forEach(a => msg += `\n${a.metric}: ${a.cause}. \nFix: ${a.action}`);
                alert(msg);
            } else {
                alert("Sync Successful - All measurements within spec.");
            }
        } catch (e) { alert("Error: " + e.message); } 
        finally { btn.disabled = false; btn.innerText = "SYNC & RUN AI DIAGNOSTIC"; }
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Double Seam Inspection | REC 7.2.12</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; background: #f8f9fa; padding: 15px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 13px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        th { background: #003366; color: white; }
        .input-cell { width: 60px; padding: 5px; border: 1px solid #ddd; text-align: center; }
        .calc-row { background: #e9f5ff; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h2>Double Seam Inspection - REC 7.2.12</h2>
    
    <div class="meta-grid">
        <div><label>AG CODE</label><input type="text" id="ag_code" class="input-cell" style="width:100%"></div>
        <div><label>Pallet Cans</label><input type="text" id="pallet_cans" class="input-cell" style="width:100%"></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr><th>Measure</th><th colspan="3">CAN 1 (Pts 1,2,3)</th><th colspan="3">CAN 2 (Pts 1,2,3)</th></tr>
            </thead>
            <tbody id="tableBody">
                <tr><td>Seam Length</td>
                    <td><input type="number" class="input-cell sl" id="sl_c1_p1"></td><td><input type="number" class="input-cell sl" id="sl_c1_p2"></td><td><input type="number" class="input-cell sl" id="sl_c1_p3"></td>
                    <td><input type="number" class="input-cell sl" id="sl_c2_p1"></td><td><input type="number" class="input-cell sl" id="sl_c2_p2"></td><td><input type="number" class="input-cell sl" id="sl_c2_p3"></td>
                </tr>
                <tr><td>Body Hook</td>
                    <td><input type="number" class="input-cell bh" id="bh_c1_p1"></td><td><input type="number" class="input-cell bh" id="bh_c1_p2"></td><td><input type="number" class="input-cell bh" id="bh_c1_p3"></td>
                    <td><input type="number" class="input-cell bh" id="bh_c2_p1"></td><td><input type="number" class="input-cell bh" id="bh_c2_p2"></td><td><input type="number" class="input-cell bh" id="bh_c2_p3"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <button class="btn-submit" id="submitBtn" onclick="submitData()">SYNC FULL REPORT TO CLOUD</button>
</div>

<script type="module">
    import { supabase } from '../assets/js/db-config.js';

    window.submitData = async () => {
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "Syncing...";

        // Collect the detailed data
        const payload = {
            ag_code: document.getElementById('ag_code').value,
            pallet_cans: document.getElementById('pallet_cans').value,
            // Example of collecting all 6 points for Seam Length
            data_sl: [
                document.getElementById('sl_c1_p1').value, document.getElementById('sl_c1_p2').value, document.getElementById('sl_c1_p3').value,
                document.getElementById('sl_c2_p1').value, document.getElementById('sl_c2_p2').value, document.getElementById('sl_c2_p3').value
            ]
        };

        const { error } = await supabase.from('double_seam_logs').insert([payload]);
        
        if (error) {
            alert("Error: " + error.message);
        } else {
            alert("Full report synced!");
        }
        btn.disabled = false;
        btn.innerText = "SYNC FULL REPORT TO CLOUD";
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="theme-production">
    <div class="container">
        <h2>Double Seam Inspection</h2>
        <form id="seamForm">
            <label>Job Number</label>
            <input type="text" id="job_number" required>
            
            <label>Operator Name</label>
            <input type="text" id="operator_name" required>

            <label>Seam Thickness</label>
            <input type="number" step="0.001" id="seam_thickness">

            <button type="submit">Submit Record</button>
        </form>
    </div>
    <script type="module" src="seam-script.js"></script>
</body>
</html>

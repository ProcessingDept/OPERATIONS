<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Seam Inspection | REC 7.2.12</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        /* Essential internal styling to ensure your table looks right */
        .table-container { overflow-x: auto; margin: 20px 0; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #003366; color: white; }
        .table-input { width: 90%; padding: 5px; border: 1px solid #ccc; }
        .btn-submit { background: #2e7d32; color: white; padding: 15px; width: 100%; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Double Seam Inspection - REC 7.2.12</h2>
    
    <div class="meta-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
        <div class="form-group"><label>AG CODE</label><input type="text" id="ag_code" class="table-input"></div>
        <div class="form-group"><label>Pallet Cans</label><input type="text" id="pallet_cans" class="table-input"></div>
    </div>

    <div class="table-container">
        <table id="inspectionTable">
            <thead>
                <tr>
                    <th>Measure</th>
                    <th>Can 1</th>
                    <th>Can 2</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Seam Thickness</td>
                    <td><input type="number" step="0.001" id="st_c1" class="table-input"></td>
                    <td><input type="number" step="0.001" id="st_c2" class="table-input"></td>
                </tr>
                <tr>
                    <td>Body Hook</td>
                    <td><input type="number" step="0.01" id="bh_c1" class="table-input"></td>
                    <td><input type="number" step="0.01" id="bh_c2" class="table-input"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <button class="btn-submit" id="submitBtn" onclick="submitData()">SYNC TO DATABASE</button>
    <div id="statusMessage" style="margin-top:15px; text-align:center; font-weight:bold;"></div>
</div>

<script type="module">
    // Import the pre-configured supabase client
    import { supabase } from '../assets/js/db-config.js';

    window.submitData = async () => {
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('statusMessage');
        
        btn.disabled = true;
        btn.innerText = "Syncing...";

        // Gather all data
        const payload = {
            ag_code: document.getElementById('ag_code').value,
            pallet_cans: document.getElementById('pallet_cans').value,
            st_c1: parseFloat(document.getElementById('st_c1').value),
            st_c2: parseFloat(document.getElementById('st_c2').value),
            bh_c1: parseFloat(document.getElementById('bh_c1').value),
            bh_c2: parseFloat(document.getElementById('bh_c2').value)
        };

        try {
            const { error } = await supabase.from('double_seam_logs').insert([payload]);
            if (error) throw error;
            
            status.innerHTML = "<span style='color:green;'>✓ Success: Record saved to cloud!</span>";
        } catch (err) {
            status.innerHTML = `<span style='color:red;'>✗ Error: ${err.message}</span>`;
        } finally {
            btn.disabled = false;
            btn.innerText = "SYNC TO DATABASE";
        }
    };
</script>

</body>
</html>

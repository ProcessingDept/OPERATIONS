<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Double Seam Inspection | REC 7.2.12</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; background: #f8f9fa; padding: 15px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 13px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        th { background: #003366; color: white; }
        .input-cell { width: 60px; padding: 5px; border: 1px solid #ddd; text-align: center; }
        .calc-row { background: #e9f5ff; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h2>Double Seam Inspection - REC 7.2.12</h2>
    
    <div class="meta-grid">
        <div><label>AG CODE</label><input type="text" id="ag_code" class="input-cell" style="width:100%"></div>
        <div><label>Pallet Cans</label><input type="text" id="pallet_cans" class="input-cell" style="width:100%"></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr><th>Measure</th><th colspan="3">CAN 1 (Pts 1,2,3)</th><th colspan="3">CAN 2 (Pts 1,2,3)</th></tr>
            </thead>
            <tbody id="tableBody">
                <tr><td>Seam Length</td>
                    <td><input type="number" class="input-cell sl" id="sl_c1_p1"></td><td><input type="number" class="input-cell sl" id="sl_c1_p2"></td><td><input type="number" class="input-cell sl" id="sl_c1_p3"></td>
                    <td><input type="number" class="input-cell sl" id="sl_c2_p1"></td><td><input type="number" class="input-cell sl" id="sl_c2_p2"></td><td><input type="number" class="input-cell sl" id="sl_c2_p3"></td>
                </tr>
                <tr><td>Body Hook</td>
                    <td><input type="number" class="input-cell bh" id="bh_c1_p1"></td><td><input type="number" class="input-cell bh" id="bh_c1_p2"></td><td><input type="number" class="input-cell bh" id="bh_c1_p3"></td>
                    <td><input type="number" class="input-cell bh" id="bh_c2_p1"></td><td><input type="number" class="input-cell bh" id="bh_c2_p2"></td><td><input type="number" class="input-cell bh" id="bh_c2_p3"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <button class="btn-submit" id="submitBtn" onclick="submitData()">SYNC FULL REPORT TO CLOUD</button>
</div>

<script type="module">
    import { supabase } from '../assets/js/db-config.js';

window.submitData = async () => {
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = "Syncing...";

    try {
        // 1. Insert Header Data
        const { data: header, error: headerError } = await supabase
            .from('double_seam_inspection_log')
            .insert([{
                inspector: 'Current User', // Add your logic to get user
                inspection_date: new Date().toISOString(),
                job_number: 'PENDING', // Get from input
                ag_code: document.getElementById('ag_code').value,
                pallet_code_cans: document.getElementById('pallet_cans').value,
                // Add other header fields here
            }])
            .select();

        if (headerError) throw headerError;
        const logId = header[0].id; // THIS IS THE KEY

        // 2. Prepare Measurement Data
        const measurements = [
            {
                log_id: logId,
                metric_name: 'seam_length',
                can_a_p1: document.getElementById('sl_c1_p1').value,
                can_a_p2: document.getElementById('sl_c1_p2').value,
                can_a_p3: document.getElementById('sl_c1_p3').value,
                can_b_p1: document.getElementById('sl_c2_p1').value,
                can_b_p2: document.getElementById('sl_c2_p2').value,
                can_b_p3: document.getElementById('sl_c2_p3').value
            },
            {
                log_id: logId,
                metric_name: 'body_hook',
                can_a_p1: document.getElementById('bh_c1_p1').value,
                can_a_p2: document.getElementById('bh_c1_p2').value,
                can_a_p3: document.getElementById('bh_c1_p3').value,
                can_b_p1: document.getElementById('bh_c2_p1').value,
                can_b_p2: document.getElementById('bh_c2_p2').value,
                can_b_p3: document.getElementById('bh_c2_p3').value
            }
        ];

        // 3. Batch Insert Measurements
        const { error: measError } = await supabase
            .from('inspection_measurements')
            .insert(measurements);

        if (measError) throw measError;

        alert("Full report synced!");

    } catch (err) {
        alert("Error: " + err.message);
    } finally {
        btn.disabled = false;
        btn.innerText = "SYNC FULL REPORT TO CLOUD";
    }
};
</script>
</body>
</html>

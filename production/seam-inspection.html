<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Seam Audit</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<div class="header">
    <input type="text" id="inspector_name" placeholder="Inspector Name" required>
    <input type="text" id="line_number" placeholder="Line #" required>
</div>

<div id="form">
    <div class="metric-card" data-metric="thickness_te"><label>Plate Thickness (Te - Lid)</label><div class="input-row"><input type="number" class="p1" placeholder="Pt 1"><input type="number" class="p2" placeholder="Pt 2"></div></div>
    <div class="metric-card" data-metric="thickness_tb"><label>Plate Thickness (Tb - Body)</label><div class="input-row"><input type="number" class="p1" placeholder="Pt 1"><input type="number" class="p2" placeholder="Pt 2"></div></div>
    <div class="metric-card" data-metric="seam_thickness"><label>Seam Thickness</label><div class="input-row"><input type="number" class="p1" placeholder="Pt 1"><input type="number" class="p2" placeholder="Pt 2"></div></div>
    <div class="metric-card" data-metric="seam_length"><label>Seam Length</label><div class="input-row"><input type="number" class="p1" placeholder="Pt 1"><input type="number" class="p2" placeholder="Pt 2"></div></div>
    <div class="metric-card" data-metric="body_hook"><label>Body Hook</label><div class="input-row"><input type="number" class="p1" placeholder="Pt 1"><input type="number" class="p2" placeholder="Pt 2"></div></div>
    <div class="metric-card" data-metric="cover_hook"><label>Cover Hook</label><div class="input-row"><input type="number" class="p1" placeholder="Pt 1"><input type="number" class="p2" placeholder="Pt 2"></div></div>
    <div class="metric-card" data-metric="actual_overlap"><label>Actual Overlap</label><div class="input-row"><input type="number" class="p1" placeholder="Pt 1"><input type="number" class="p2" placeholder="Pt 2"></div></div>
    <div class="metric-card" data-metric="bhb_percent"><label>BHB %</label><div class="input-row"><input type="number" class="p1" placeholder="Pt 1"><input type="number" class="p2" placeholder="Pt 2"></div></div>
    <div class="metric-card" data-metric="freespace_ext"><label>Freespace Ext</label><div class="input-row"><input type="number" class="p1" placeholder="Pt 1"><input type="number" class="p2" placeholder="Pt 2"></div></div>
</div>

<button onclick="submitInspection()">SYNC FULL AUDIT</button>

<script type="module">
    import { supabase } from './db-config.js';

    window.submitInspection = async () => {
        // 1. Mandatory Validation
        const allInputs = document.querySelectorAll('input');
        for (let input of allInputs) {
            if (!input.value) { alert("Please fill in ALL fields for a Full Audit."); return; }
        }

        // 2. Insert Log
        const { data: log } = await supabase.from('double_seam_inspection_log')
            .insert([{ inspector_name: document.getElementById('inspector_name').value }])
            .select();

        // 3. Insert Measurements
        const records = Array.from(document.querySelectorAll('.metric-card')).map(card => ({
            log_id: log[0].id,
            metric_name: card.getAttribute('data-metric'),
            val_p1: card.querySelector('.p1').value,
            val_p2: card.querySelector('.p2').value
        }));

        await supabase.from('inspection_measurements').insert(records);
        alert("Full Audit Sync Complete.");
    };
</script>
</body>
</html>
